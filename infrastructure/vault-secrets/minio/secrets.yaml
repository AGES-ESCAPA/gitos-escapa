# Somente referências; os valores são cadastrados diretamente no Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: minio
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: minio
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-minio
          serviceAccountRef:
            name: vault-secrets
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: minio
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: minio-root-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: rootUser
    remoteRef:
      key: escapa/minio
      property: rootUser
  - secretKey: rootPassword
    remoteRef:
      key: escapa/minio
      property: rootPassword
