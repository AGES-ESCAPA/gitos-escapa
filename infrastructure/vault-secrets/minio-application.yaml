apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AGES-ESCAPA/gitos-escapa.git
    targetRevision: main
    path: infrastructure/vault-secrets/minio
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
