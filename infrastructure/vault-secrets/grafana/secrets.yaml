# Somente referências; os valores são cadastrados diretamente no Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-grafana
          serviceAccountRef:
            name: vault-secrets
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: admin-user
    remoteRef:
      key: escapa/grafana
      property: admin-user
  - secretKey: admin-password
    remoteRef:
      key: escapa/grafana
      property: admin-password
