apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "65.5.1"
    helm:
      releaseName: prometheus
      values: |
        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          # Publico em grafana.escapaages.online: Cloudflare termina o TLS e o tunel
          # encaminha *.escapaages.online para o Traefik (entrypoint web, HTTP).
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web
            hosts:
              - grafana.escapaages.online
            path: /
          grafana.ini:
            server:
              root_url: https://grafana.escapaages.online
            security:
              cookie_secure: true
              disable_gravatar: true
            users:
              allow_sign_up: false
            auth.anonymous:
              enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Remove do banco do Grafana o datasource provisionado antes de desligar o Alertmanager.
          deleteDatasources:
            - name: Alertmanager
              orgId: 1
          # Os sidecars (k8s-sidecar, Python) usam ~65Mi parados: com 64Mi levavam OOMKilled.
          sidecar:
            # Alertmanager esta desligado; sem isto o Grafana ganha um datasource quebrado.
            datasources:
              alertmanager:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
          persistence:
            enabled: true
            storageClassName: local-path
            size: 1Gi
          deploymentStrategy:
            type: Recreate
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 24h
            retentionSize: 1GB
            scrapeInterval: 60s
            evaluationInterval: 60s
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 3Gi
        # Sem destino de alerta configurado; desligado para poupar memoria do node.
        alertmanager:
          enabled: false
          alertmanagerSpec:
            replicas: 1
            retention: 24h
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 64Mi
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 32Mi
          admissionWebhooks:
            patch:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        # O k3s single-node não expõe esses componentes como no Kubernetes padrão.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # Primeiro teste: sincronizar por etapa e medir o consumo antes da próxima.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
