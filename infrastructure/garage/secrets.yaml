# Somente referências; os valores (escapa/garage) são cadastrados diretamente no Vault.
# O role eso-escapa do Vault precisa aceitar o namespace garage em bound_service_account_namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-escapa
          serviceAccountRef:
            name: vault-secrets
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: garage-secrets
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: rpcSecret
    remoteRef:
      key: escapa/garage
      property: rpcSecret
  - secretKey: adminToken
    remoteRef:
      key: escapa/garage
      property: adminToken
