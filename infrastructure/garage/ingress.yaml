apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: media.escapaages.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-web
                port:
                  number: 3902
