apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AGES-ESCAPA/gitos-escapa.git
    targetRevision: main
    path: infrastructure/garage
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    # Sincronização manual: o layout do cluster Garage é aplicado à mão no primeiro boot (ver README.md).
    syncOptions:
      - CreateNamespace=true
