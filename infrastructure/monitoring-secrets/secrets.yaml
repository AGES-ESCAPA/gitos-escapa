# Somente referências; os valores (escapa/grafana) são cadastrados diretamente no Vault.
# O role eso-escapa do Vault precisa aceitar o namespace monitoring em bound_service_account_namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-escapa
          serviceAccountRef:
            name: vault-secrets
            audiences:
            - vault
---
# Consumido pelo Grafana do kube-prometheus-stack (grafana.admin.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: admin-user
    remoteRef:
      key: escapa/grafana
      property: admin-user
  - secretKey: admin-password
    remoteRef:
      key: escapa/grafana
      property: admin-password
