apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    # As regras de ingress (hostname -> servico) sao gerenciadas remotamente na
    # Cloudflare (via cloudflare_tunnel_config no Terraform) -- aqui so aponta
    # onde estao as credenciais do tunel.
    tunnel: escapa-k3s
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
