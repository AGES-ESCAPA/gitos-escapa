apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AGES-ESCAPA/gitos-escapa.git
    targetRevision: main
    path: infrastructure/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    # Sincronização manual durante a configuração inicial do conector.
    syncOptions:
      - CreateNamespace=true
