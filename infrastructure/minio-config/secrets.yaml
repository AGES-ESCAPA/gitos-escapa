# Somente referências; os valores (escapa/minio) são cadastrados diretamente no Vault.
# O role eso-escapa do Vault precisa aceitar o namespace minio em
# bound_service_account_namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-escapa
          serviceAccountRef:
            name: vault-secrets
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: minio-root-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  # Nomes de chave exigidos pelo chart minio (existingSecret).
  - secretKey: rootUser
    remoteRef:
      key: escapa/minio
      property: rootUser
  - secretKey: rootPassword
    remoteRef:
      key: escapa/minio
      property: rootPassword
