apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: "5.4.0"
    helm:
      releaseName: minio
      values: |
        mode: standalone
        persistence:
          enabled: true
          storageClass: local-path
          size: 50Gi
        buckets:
          - name: escapa-materiais       # vídeos/materiais complementares dos cursos
            policy: none
          - name: escapa-certificados    # certificados em PDF
            policy: none
        rootUser: admin
        rootPassword: changeme   # mover para Vault/ExternalSecret
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
