# Somente referência; usa a SecretStore "vault" já definida em
# apps/escapa/database/secrets.yaml (compartilhada por todo o namespace escapa).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: escapa-frontend-config
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: escapa-frontend-config
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: VITE_API_BASE_URL
    remoteRef:
      key: escapa/frontend
      property: VITE_API_BASE_URL
