apiVersion: apps/v1
kind: Deployment
metadata:
  name: escapa-frontend
  labels:
    app: escapa-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escapa-frontend
  template:
    metadata:
      labels:
        app: escapa-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret   # criado pelo Terraform (user_data), não pelo Git
      containers:
        - name: frontend
          image: ghcr.io/ages-escapa/escapa-frontend:aaa53a83bf23c02db6fdbb7a3460f325e52468d1
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: escapa-frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
