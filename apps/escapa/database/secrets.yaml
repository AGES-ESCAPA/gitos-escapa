# Somente referências; os valores são cadastrados diretamente no Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-database
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-database
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-database
          serviceAccountRef:
            name: vault-secrets-database
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: escapa-database-creds
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-database
    kind: SecretStore
  target:
    name: escapa-database-creds
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: dbname
    remoteRef:
      key: escapa/database
      property: dbname
  - secretKey: username
    remoteRef:
      key: escapa/database
      property: username
  - secretKey: password
    remoteRef:
      key: escapa/database
      property: password
