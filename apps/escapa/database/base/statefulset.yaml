apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: escapa-database
spec:
  serviceName: escapa-database
  replicas: 1
  selector:
    matchLabels:
      app: escapa-database
  template:
    metadata:
      labels:
        app: escapa-database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "escapa"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: escapa-database-creds
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: escapa-database-creds
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
