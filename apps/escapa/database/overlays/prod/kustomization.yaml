apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: escapa-prod
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: escapa-database
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/storage
        value: 20Gi
