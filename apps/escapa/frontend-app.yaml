apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: escapa-frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AGES-ESCAPA/gitos-escapa.git
    targetRevision: main
    path: apps/escapa/frontend/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: escapa-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
