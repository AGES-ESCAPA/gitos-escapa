apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: escapa-backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: api.escapaages.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: escapa-backend
                port:
                  number: 8080
