# Somente referências; os valores são cadastrados diretamente no Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-backend
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-backend
          serviceAccountRef:
            name: vault-secrets-backend
            audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: escapa-backend-config
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: escapa-backend-config
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: SPRING_DATASOURCE_URL
    remoteRef:
      key: escapa/backend
      property: SPRING_DATASOURCE_URL
  - secretKey: SPRING_DATASOURCE_USERNAME
    remoteRef:
      key: escapa/backend
      property: SPRING_DATASOURCE_USERNAME
  - secretKey: SPRING_DATASOURCE_PASSWORD
    remoteRef:
      key: escapa/backend
      property: SPRING_DATASOURCE_PASSWORD
  - secretKey: SERVER_PORT
    remoteRef:
      key: escapa/backend
      property: SERVER_PORT
  - secretKey: SPRING_JPA_HIBERNATE_DDL_AUTO
    remoteRef:
      key: escapa/backend
      property: SPRING_JPA_HIBERNATE_DDL_AUTO
  - secretKey: SPRING_JPA_SHOW_SQL
    remoteRef:
      key: escapa/backend
      property: SPRING_JPA_SHOW_SQL
  - secretKey: APP_CORS_ALLOWED_ORIGINS
    remoteRef:
      key: escapa/backend
      property: APP_CORS_ALLOWED_ORIGINS
