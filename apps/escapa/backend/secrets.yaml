# Somente referência; usa a SecretStore "vault" já definida em
# apps/escapa/database/secrets.yaml (compartilhada por todo o namespace escapa).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: escapa-backend-config
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: escapa-backend-config
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: SPRING_DATASOURCE_URL
    remoteRef:
      key: escapa/backend
      property: SPRING_DATASOURCE_URL
  - secretKey: SPRING_DATASOURCE_USERNAME
    remoteRef:
      key: escapa/backend
      property: SPRING_DATASOURCE_USERNAME
  - secretKey: SPRING_DATASOURCE_PASSWORD
    remoteRef:
      key: escapa/backend
      property: SPRING_DATASOURCE_PASSWORD
  - secretKey: SERVER_PORT
    remoteRef:
      key: escapa/backend
      property: SERVER_PORT
  - secretKey: SPRING_JPA_HIBERNATE_DDL_AUTO
    remoteRef:
      key: escapa/backend
      property: SPRING_JPA_HIBERNATE_DDL_AUTO
  - secretKey: SPRING_JPA_SHOW_SQL
    remoteRef:
      key: escapa/backend
      property: SPRING_JPA_SHOW_SQL
  - secretKey: APP_CORS_ALLOWED_ORIGINS
    remoteRef:
      key: escapa/backend
      property: APP_CORS_ALLOWED_ORIGINS
  - secretKey: MINIO_ENDPOINT
    remoteRef:
      key: escapa/backend
      property: MINIO_ENDPOINT
  - secretKey: MINIO_ROOT_USER
    remoteRef:
      key: escapa/backend
      property: MINIO_ROOT_USER
  - secretKey: MINIO_ROOT_PASSWORD
    remoteRef:
      key: escapa/backend
      property: MINIO_ROOT_PASSWORD
  - secretKey: MINIO_BUCKET
    remoteRef:
      key: escapa/backend
      property: MINIO_BUCKET
  - secretKey: MINIO_PUBLIC_BASE_URL
    remoteRef:
      key: escapa/backend
      property: MINIO_PUBLIC_BASE_URL
  - secretKey: MINIO_PUBLIC_URL_INCLUDE_BUCKET
    remoteRef:
      key: escapa/backend
      property: MINIO_PUBLIC_URL_INCLUDE_BUCKET
  - secretKey: MINIO_REGION
    remoteRef:
      key: escapa/backend
      property: MINIO_REGION
