apiVersion: apps/v1
kind: Deployment
metadata:
  name: escapa-backend
  labels:
    app: escapa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escapa-backend
  template:
    metadata:
      labels:
        app: escapa-backend
    spec:
      serviceAccountName: escapa-backend
      imagePullSecrets:
        - name: ghcr-pull-secret   # criado pelo Terraform (user_data), não pelo Git
      containers:
        - name: backend
          image: ghcr.io/ages-escapa/escapa-backend:a6439c2fb1f23c5567979dab6b8e2455c5f3cf4f
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: escapa-backend-config
          env:
            - name: DATABASE_HOST
              value: "escapa-database"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
